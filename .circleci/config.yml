version: 2.1

executors:
  default:
    docker:
      - image: cimg/go:1.26.2
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_USER: test
          POSTGRES_DB: test

jobs:
  postgres:
    docker:
      - image: cimg/go:1.26.2
        environment:
          DATABASE_MIGRATIONS: migrations/sql
      - image: postgres:18-alpine
        environment:
          POSTGRES_USER: test
          POSTGRES_DB: test
    steps:
      - checkout
      - run: echo "run migrations"

workflows:
  test:
    jobs:
      - postgres
