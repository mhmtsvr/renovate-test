version: 2.1

executors:
  default:
    docker:
      - image: cimg/go:1.27.1
      - image: cimg/postgres:13.5
        environment:
          POSTGRES_USER: test
          POSTGRES_DB: test

jobs:
  postgres:
    docker:
      - image: cimg/go:1.27.1
        environment:
          DATABASE_MIGRATIONS: migrations/sql
      - image: postgres:13-alpine
        environment:
          POSTGRES_USER: test
          POSTGRES_DB: test
    steps:
      - checkout
      - run: echo "run migrations"

workflows:
  test:
    jobs:
      - postgres
